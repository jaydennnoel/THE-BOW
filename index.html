    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["BarOrPub", "Restaurant"],
        "name": "The Bow",
        "slogan": "Burgers | Brews | Billiards",
        "description": "A bar, restaurant and billiards hall serving burgers, cold beer and open pool tables. Walk-ins only — no reservations taken.",
        "url": "https://REPLACE-WITH-DOMAIN.com/",
        "image": "https://REPLACE-WITH-DOMAIN.com/og-image.jpg",
        "telephone": "[+1-000-000-0000]",
        "email": "[hello@thebow.com]",
        "priceRange": "[$$]",
        "servesCuisine": ["American", "Burgers", "Bar food"],
        "acceptsReservations": "False",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "[Street address]",
          "addressLocality": "[City]",
          "addressRegion": "[State]",
          "postalCode": "[ZIP]",
          "addressCountry": "US"
        },
        "geo": { "@type": "GeoCoordinates", "latitude": "[00.0000]", "longitude": "[00.0000]" },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
            "opens": "[opens]",
            "closes": "21:00"
          }
        ],
        "amenityFeature": [
          { "@type": "LocationFeatureSpecification", "name": "Billiards tables", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Walk-ins welcome", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Full bar", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Live music", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Sports on TV", "value": true }
        ],
        "sameAs": ["[https://instagram.com/…]", "[https://facebook.com/…]"],
        "hasMenu": "https://REPLACE-WITH-DOMAIN.com/menu"
      }
    </script>
